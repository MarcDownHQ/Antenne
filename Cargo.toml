[workspace]
resolver = "3"
members = [".", "smoke"]
default-members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/MarcDownHQ/Antenne"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[package]
name = "antenne"
description = "A Nightglass plugin: French live TV channels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
serde_json = "1.0.154"

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = "0.63.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
